[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halo42"
version = "0.1.0"
description = "Halo42 application with Vercel Web Analytics"
requires-python = ">=3.9"
dependencies = [
    "fasthtml>=0.1.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
